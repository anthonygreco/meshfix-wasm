name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Emscripten
        run: bash scripts/install-emsdk.sh

      - name: Build WASM
        run: bash scripts/build-wasm.sh

      - name: Build TypeScript
        run: npm run build:ts

      - name: Verify dist output
        run: |
          test -f dist/meshfix-core.js || (echo "Missing meshfix-core.js" && exit 1)
          test -f dist/meshfix-core.wasm || (echo "Missing meshfix-core.wasm" && exit 1)
          test -f dist/index.js || (echo "Missing index.js" && exit 1)
          test -f dist/index.d.ts || (echo "Missing index.d.ts" && exit 1)
          test -f dist/worker.js || (echo "Missing worker.js" && exit 1)
          echo "All expected dist files present"

      - name: Verify npm package
        run: npm pack --dry-run

      - name: Run automated tests
        run: npm test
